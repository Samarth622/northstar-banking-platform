name: Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and verify
        run: ./mvnw -B -ntp clean verify

  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability, misconfiguration, and secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
          trivy-config: .trivy.yaml

  codeql:
    name: CodeQL Java
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  gitguardian:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ggshield
        run: python -m pip install --upgrade pip ggshield
      - name: Scan secrets
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::GITGUARDIAN_API_KEY repository secret is required"
            exit 1
          fi
          ggshield secret scan ci

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [build, trivy, codeql, gitguardian]
    steps:
      - name: Enforce mandatory checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SECRET_RESULT: ${{ needs.gitguardian.result }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          failed=0
          for result in "$BUILD_RESULT" "$TRIVY_RESULT" "$CODEQL_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::Mandatory check did not succeed: $result"
              failed=1
            fi
          done
          if [ "$SECRET_RESULT" != "success" ]; then
            if [ "$IS_FORK_PR" = "true" ] && [ "$SECRET_RESULT" = "skipped" ]; then
              echo "::notice::GitGuardian skipped safely for a fork pull request"
            else
              echo "::error::GitGuardian secret scan did not succeed"
              failed=1
            fi
          fi
          exit "$failed"
